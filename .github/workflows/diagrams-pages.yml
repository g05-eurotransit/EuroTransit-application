name: Publish diagrams

on:
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/**/*.html'
      - '.github/workflows/diagrams-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagrams-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage standalone HTML diagrams
        working-directory: docs/diagrams
        run: |
          mkdir -p "$RUNNER_TEMP/diagram-pages"
          find . -type f -name '*.html' -exec cp --parents '{}' "$RUNNER_TEMP/diagram-pages/" \;
          touch "$RUNNER_TEMP/diagram-pages/.nojekyll"
          test -f "$RUNNER_TEMP/diagram-pages/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/diagram-pages

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
