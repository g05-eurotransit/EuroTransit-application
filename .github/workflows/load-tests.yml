name: Checkout load harness
on:
  pull_request:
    paths: ['load-tests/**', '.github/workflows/load-tests.yml']
  push:
    branches: [main, dev]
    paths: ['load-tests/**', '.github/workflows/load-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node --test load-tests/tests/*.test.mjs
      - run: python -m unittest discover -s load-tests/tests -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: load-tests/Dockerfile
          push: false
  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: eurotransitregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: load-tests/Dockerfile
          push: true
          tags: eurotransitregistry.azurecr.io/eurotransit/load-tests:${{ github.sha }}
