# Note on Scrape Labels:
# Dashboards in this folder query Prometheus using {namespace="eurotransit", app="..."} selectors.
# In local development, they rely on docker/observability/prometheus.yml statically attaching those
# labels to each target to mirror the Kubernetes cluster ServiceMonitor scheme.
# Modifying or stripping those labels in prometheus.yml will silently empty these panels (No Data).

apiVersion: 1
providers:
  - name: 'EuroTransit Dashboards'
    orgId: 1
    folder: 'EuroTransit'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards
