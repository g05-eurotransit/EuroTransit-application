server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Environment-specific public configuration is mounted by Kubernetes/Compose.
    # Never cache it across deployments and never fall back to the SPA for a missing file.
    location = /config/config.json {
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No secrets served here — static assets only. CSP/HSTS/security headers are set at
    # the gateway (Traefik middleware), not per-app, per 07b slides 21 & 28.
}
