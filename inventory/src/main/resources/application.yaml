spring:
  reactor:
    context-propagation: auto

  application:
    name: inventory
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/eurotransit}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8081/realms/eurotransit/protocol/openid-connect/certs}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_db}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_db}
    user: ${DB_USER:inventory}
    password: ${DB_PASSWORD:password}

server:
  port: 8082

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

inventory:
  reservations:
    expiration:
      # Off by default. Releasing expired holds is only safe once Orders confirms the
      # reservation synchronously after payment authorization; before that, this sweep
      # can free seats belonging to a paid order and let them be sold twice.
      # Release gate: docs/design/reservation-confirmation.md
      enabled: ${INVENTORY_RESERVATION_EXPIRATION_ENABLED:false}
  idempotency:
    purge:
      # On by default, and independent of the expiration toggle above: this only keeps
      # idempotency_records within the 30-minute retention in docs/design/api-design.md.
      enabled: ${INVENTORY_IDEMPOTENCY_PURGE_ENABLED:true}
