logging:
  structured:
    format:
      console: ""

management:
  tracing:
    export:
      enabled: false

inventory:
  reservations:
    # 1 hour initial delay and interval in test profile to prevent background scheduler interference
    cleanup-initial-delay-ms: 3600000
    cleanup-interval-ms: 3600000
  idempotency:
    cleanup-initial-delay-ms: 3600000
    cleanup-interval-ms: 3600000
